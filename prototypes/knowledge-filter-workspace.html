<!doctype html>
<html lang="zh-CN">
<head>

<title>Knavis · 可配置知识筛选原型</title>
<style>
:root{--ink:#162a2b;--muted:#718181;--line:#dfe9e5;--soft:#f4f8f6;--panel:#fff;--green:#078761;--green-dark:#056b50;--mint:#e6f6ee;--amber:#cf7c36;--nav:#fbfcfb;--shadow:0 14px 34px rgba(24,66,54,.08);font-family:"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-size:14px}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{display:flex;min-height:100vh}.rail{width:260px;flex:0 0 260px;background:var(--nav);border-right:1px solid var(--line);padding:17px 11px;display:flex;flex-direction:column}.brand{height:54px;padding:0 10px;display:flex;align-items:center;font-size:19px;font-weight:800;color:#183737}.brand-mark{width:27px;height:31px;margin-right:9px;position:relative;border-left:3px solid #123b3d;border-right:3px solid #0a9b72;transform:skew(-12deg)}.brand-mark:after{content:"";position:absolute;left:8px;top:4px;height:23px;border-left:3px solid #d35a37}.nav{display:grid;gap:4px;margin-top:13px}.nav-item{height:40px;padding:0 12px;border-radius:8px;text-align:left;color:#506160;display:flex;align-items:center;gap:11px}.nav-item:hover,.nav-item.active{background:var(--mint);color:var(--green);font-weight:700}.nav-icon{width:18px;text-align:center;font-size:16px}.rail-label{padding:25px 12px 8px;color:#a0aeaa;font-size:11px;letter-spacing:.08em}.quick{display:grid;gap:3px}.quick button{height:35px;text-align:left;padding:0 12px;color:#667674;border-radius:7px}.quick button:hover{background:#eef5f2;color:var(--green)}.profile{margin-top:auto;border-top:1px solid var(--line);padding:14px 9px 2px;display:flex;gap:10px;align-items:center}.avatar{width:30px;height:30px;border-radius:50%;background:#dff4e9;color:var(--green);display:grid;place-items:center;font-weight:800}.profile small{display:block;color:#8b9a96;font-size:11px;margin-top:3px}.main{flex:1;min-width:0;padding:28px 38px 56px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.eyebrow{font-size:11px;color:var(--green);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.page-head h1{font-size:28px;letter-spacing:-.03em;margin:8px 0 6px}.page-head p{margin:0;color:var(--muted)}.head-actions{display:flex;gap:9px}.icon-btn,.outline{height:36px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 12px;color:#5d706d}.primary{height:36px;padding:0 15px;background:var(--green);color:#fff;border-radius:7px;font-weight:700;box-shadow:0 5px 12px rgba(7,135,97,.16)}.primary:hover{background:var(--green-dark)}.workspace{margin-top:25px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.workspace-top{padding:21px 23px 0;border-bottom:1px solid var(--line)}.topline{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-bottom:14px}.workspace-body{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:650px}.filter-sidebar{padding:18px 14px;border-right:1px solid var(--line);background:#fbfdfc}.filter-sidebar-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 5px 12px}.filter-sidebar-head strong{font-size:13px}.filter-sidebar-head span{font-size:11px;color:var(--muted)}.filter-sidebar .filter-groups{padding:4px 0;border:0;background:transparent}.filter-sidebar>.manage-filters{width:100%;margin:13px 0 0;background:#fff}.filter-sidebar .active-path{margin:16px 0 0;display:block}.filter-sidebar .active-path .path-chip{display:inline-block;margin:7px 4px 0 0}.content{padding:20px 23px}..section-title{font-size:13px;color:#405652}.section-title b{color:var(--green);margin-left:5px}.result-count{color:#94a29e;font-size:12px}.filter-builder{padding:18px 0 21px;display:flex;align-items:flex-start;gap:12px}.filter-label{width:78px;padding-top:9px;color:#637572;font-size:12px;font-weight:700}.filter-groups{display:block;flex:1;border:1px solid var(--line);border-radius:8px;background:#fbfdfc;padding:6px 10px}.filter-tree{display:block}.tree-module{border-bottom:1px solid #edf2ef}.tree-module:last-child{border-bottom:0}.tree-row{width:100%;min-height:38px;display:flex;align-items:center;gap:7px;padding:0 6px;text-align:left;color:#425855;font-size:12px}.tree-row:hover,.tree-row.selected{background:var(--mint);color:var(--green)}.tree-row .tree-toggle{width:18px;color:#8da09a;font-size:11px}.tree-row .tree-folder{color:#7d958d}.tree-row strong{font-weight:700}.tree-row small{margin-left:auto;color:#9baaa5}.tree-children{display:none;padding-left:20px}.tree-children.open{display:block}.tree-child{position:relative}.tree-child:before{content:"";position:absolute;left:9px;top:0;bottom:0;border-left:1px solid #dce9e3}.tree-child>.tree-row{padding-left:18px}.tree-child>.tree-row .tree-toggle{margin-left:-8px;background:#fbfdfc}.tree-module>.tree-row{min-height:42px}.tree-module.active>.tree-row{color:var(--green);font-weight:700}.builder-actions{display:flex;gap:6px}.manage-filters{height:34px;padding:0 10px;border:1px dashed #a6cfc0;border-radius:7px;color:var(--green);white-space:nowrap}.active-path{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 23px 18px;padding:10px 11px;background:#f6faf8;border:1px solid #e3eee9;border-radius:7px;color:#70817c;font-size:12px}.path-chip{background:#e3f4eb;color:var(--green-dark);border-radius:4px;padding:4px 7px}.path-sep{color:#a2b0ab}.content{padding:20px 23px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.scope-chip{height:31px;border:1px solid var(--line);border-radius:6px;padding:0 10px;color:#6c7c79;background:#fff}.scope-chip.active{border-color:#abdcc8;color:var(--green);background:var(--mint);font-weight:700}.search{width:200px;height:32px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;padding:0 9px;color:#98a5a1}.search input{border:0;outline:0;width:100%;background:transparent;margin-left:6px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:9px;padding:17px;min-height:174px;background:#fff;position:relative;cursor:pointer;transition:.18s}.card:hover{border-color:#9bd5bf;box-shadow:0 10px 25px rgba(29,83,64,.1);transform:translateY(-2px)}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#b9ddcd;border-radius:9px 0 0 9px}.type-label{font-size:10px;color:var(--green);font-weight:800;letter-spacing:.05em}.card h3{font-size:15px;margin:10px 0 7px}.card p{font-size:12px;line-height:1.6;color:var(--muted);min-height:38px;margin:0}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:#8b9995;font-size:11px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{padding:3px 7px;border-radius:4px;background:#f0f5f3;color:#67807a;font-size:10px}.tag.hot{background:#fff1e4;color:#a56535}.card-edit{position:absolute;right:12px;top:12px;color:#84a299;opacity:0}.card:hover .card-edit{opacity:1}.empty{padding:70px 20px;text-align:center;color:#8b9995}.drawer-backdrop{position:fixed;inset:0;background:rgba(20,43,39,.18);display:none;justify-content:flex-end;z-index:10}.drawer-backdrop.open{display:flex}.drawer{width:430px;height:100%;background:#fff;padding:25px;box-shadow:-18px 0 38px rgba(23,58,47,.14)}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-head h2{font-size:19px;margin:0}.close{font-size:24px;color:#8b9a96}.drawer p{font-size:12px;line-height:1.6;color:var(--muted)}.dimension{border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0;display:flex;align-items:center;gap:10px}.dimension b{flex:1}.dimension small{color:#9aa8a4}.drawer-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:26px}.toast{position:fixed;right:25px;bottom:24px;background:#193c35;color:#fff;border-radius:7px;padding:11px 15px;display:none}.toast.show{display:block}@media(max-width:1100px){.rail{width:220px;flex-basis:220px}.main{padding:24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.rail{width:64px;flex-basis:64px;padding:12px 8px}.brand{padding:0 8px}.brand span,.nav-item span:not(.nav-icon),.rail-label,.quick,.profile div:not(.avatar){display:none}.nav-item{justify-content:center;padding:0}.main{padding:16px 12px}.page-head{display:block}.head-actions{margin-top:17px}.head-actions .icon-btn{width:38px;padding:0;font-size:0}.head-actions .icon-btn:first-letter{font-size:14px}.head-actions .outline{font-size:0;width:42px;padding:0}.head-actions .outline:before{content:"⚙";font-size:15px}.head-actions .primary{flex:1;white-space:nowrap}.workspace-top,.content{padding-left:15px;padding-right:15px}.filter-builder{display:block}.filter-label{padding:0 0 9px}.filter-group{width:100%}.filter-groups{display:grid}.active-path{margin-left:15px;margin-right:15px}.topline{display:block}.result-count{display:block;margin-top:12px}.toolbar{display:block}.search{width:100%;margin-top:10px}.cards{grid-template-columns:1fr}.workspace-body{grid-template-columns:1fr}.filter-sidebar{border-right:0;border-bottom:1px solid var(--line)}.drawer{width:min(430px,100%)}}
</style>
</head>
<body>
<div class="app">
<aside class="rail">
  <div class="brand"><i class="brand-mark"></i><span>Knavis</span></div>
  <nav class="nav"><button class="nav-item"><span class="nav-icon">□</span><span>新对话</span></button><button class="nav-item active" id="kbNav"><span class="nav-icon">▣</span><span>知识库</span></button><button class="nav-item" id="agentNav"><span class="nav-icon">✦</span><span>智能体</span></button><button class="nav-item"><span class="nav-icon">∞</span><span>共享空间</span></button></nav>
  <div class="rail-label">工作台</div><div class="quick"><button>◷　最近访问</button><button>☆　我的收藏</button></div>
  <div class="profile"><div class="avatar">X</div><div><b>x u w h</b><small>管理员 · softroad.com.cn</small></div></div>
</aside>
<main class="main">
  <header class="page-head"><div><div class="eyebrow">可配置知识空间</div><h1 id="pageTitle">知识库</h1><p id="pageSubtitle">通过业务分类和标签，快速定位机型、项目与技术域知识。</p></div><div class="head-actions"><button class="icon-btn">⌕ 搜索</button><button class="outline" id="manageTop">⚙ 管理筛选结构</button><button class="primary" id="createResource">＋ 新建知识库</button></div></header>
  <section class="workspace">
    <div class="workspace-top"><div class="topline"><div class="section-title" id="sectionTitle">全部知识库 <b>6</b></div><span class="result-count" id="resultCount">当前显示 6 个资源</span></div></div>
    <div class="workspace-body"><aside class="filter-sidebar"><div class="filter-sidebar-head"><strong>筛选分类</strong><span>按层级定位资源</span></div><div class="filter-groups" id="filterGroups"></div><button class="manage-filters" id="manageFilters">＋ 自定义筛选结构</button><div class="active-path" id="activePath"><span>当前路径</span><span class="path-chip">全部知识</span></div></aside>
    <div class="content"><div class="toolbar"><div class="toolbar-left"><button class="scope-chip active" data-scope="all">全部</button><button class="scope-chip" data-scope="mine">我创建的</button><button class="scope-chip" data-scope="shared">已共享</button><button class="scope-chip" data-scope="legacy">历史资源</button></div><label class="search">⌕<input id="search" placeholder="搜索名称或标签"></label></div><div class="cards" id="cards"></div></div></div>
  </section>
</main>
</div>
<div class="drawer-backdrop" id="drawerBackdrop"><aside class="drawer"><div class="drawer-head"><h2>自定义筛选结构</h2><button class="close" id="closeDrawer">×</button></div><p>管理员可以创建多个一级分类，并为每个分类配置下级选项。知识库和智能体通过标签加入分类，分类本身不改变资源权限。</p><div class="dimension"><span>☷</span><b>机型</b><small>3 个下级选项</small><span>⋮</span></div><div class="dimension"><span>◫</span><b>项目</b><small>4 个下级选项</small><span>⋮</span></div><div class="dimension"><span>◇</span><b>知识域</b><small>5 个下级选项</small><span>⋮</span></div><button class="outline" style="width:100%;margin-top:5px">＋ 新增一级分类</button><div class="drawer-footer"><button class="outline" id="cancelDrawer">取消</button><button class="primary" id="saveStructure">保存结构</button></div></aside></div><div class="toast" id="toast">已保存筛选结构（原型演示）</div>
<script>
const resources=[
 {id:'kb-asp',kind:'kb',name:'ASP_ALL_KNOWLEDGE',desc:'涵盖富士通 ASP 文档、基础操作与运行规范。',tags:['机型 / 富士通ASP','知识域 / 作业流程','项目 / 通用'],scope:'mine',count:23},
 {id:'kb-cics',kind:'kb',name:'cics',desc:'CICS 运行环境、事务处理与故障排查资料。',tags:['机型 / IBM_HOST','知识域 / 运维'],scope:'shared',count:31},
 {id:'kb-jp1',kind:'kb',name:'JP1',desc:'JP1 知识库问答系统与作业管理手册。',tags:['项目 / JP1迁移','知识域 / 运维'],scope:'shared',count:15},
 {id:'kb-kn',kind:'kb',name:'KN_ASP_ALL',desc:'ASP 项目全量技术资料与运行手册。',tags:['机型 / 富士通ASP','项目 / 通用','知识域 / 技术文档'],scope:'mine',count:102},
 {id:'kb-manual',kind:'kb',name:'Manual_ASP',desc:'ASP Manual 知识库，面向项目交付和检索。',tags:['机型 / 富士通ASP','知识域 / 作业流程'],scope:'mine',count:3},
 {id:'kb-cobol',kind:'kb',name:'COBOL 迁移资料',desc:'项目迁移方案、技术点检证和交付物。',tags:['项目 / COBOL迁移','知识域 / 分析'],scope:'shared',count:28},
 {id:'agent-asp',kind:'agent',name:'ASP命令解析',desc:'针对 ASP CL 命令 manual 的智能体。',tags:['机型 / 富士通ASP','知识域 / 作业流程'],scope:'mine',count:0},
 {id:'agent-cl',kind:'agent',name:'CL命令参数解析智能体',desc:'专用于并行工作流的 CL 命令参数解析。',tags:['项目 / COBOL迁移','知识域 / 分析'],scope:'mine',count:0},
 {id:'agent-jp',kind:'agent',name:'JP1运维助手',desc:'基于 JP1 资料提供运维问答和操作建议。',tags:['项目 / JP1迁移','知识域 / 运维'],scope:'shared',count:0}
];
const dimensions={model:{label:'机型',options:[{id:'富士通ASP',label:'富士通ASP',children:[{id:'ASP-V30',label:'ASP V30'},{id:'ASP-V40',label:'ASP V40'}]},{id:'IBM_HOST',label:'IBM HOST',children:[{id:'IBM_Z',label:'IBM Z'},{id:'AS400',label:'AS400'}]},{id:'NEC_ACOS',label:'NEC ACOS',children:[{id:'NEC_ACOS-2',label:'ACOS-2'},{id:'NEC_ACOS-4',label:'ACOS-4'}]}]},project:{label:'项目',options:[{id:'通用',label:'通用'},{id:'JP1迁移',label:'JP1迁移',children:[{id:'JP1运维',label:'运维'},{id:'JP1开发',label:'开发'}]},{id:'COBOL迁移',label:'COBOL迁移',children:[{id:'COBOL技术点',label:'技术点'},{id:'COBOL交付',label:'交付物'}]}]},domain:{label:'知识域',options:[{id:'作业流程',label:'作业流程'},{id:'运维',label:'运维',children:[{id:'故障排查',label:'故障排查'},{id:'监控管理',label:'监控管理'}]},{id:'分析',label:'分析'},{id:'技术文档',label:'技术文档'}]}};
let selected={model:'all',project:'all',domain:'all'},expanded={model:true,project:false,domain:false},kind='kb',scope='all',search='';
const filters=document.querySelector('#filterGroups'),cards=document.querySelector('#cards'),path=document.querySelector('#activePath');
function optionCount(id){return resources.filter(r=>r.tags.some(t=>t.includes(id))).length}function renderTreeOption(option,key,depth=0){const hasChildren=option.children?.length;const open=hasChildren&&(!selected[key]||selected[key]===option.id||selected[key].startsWith(option.id));return `<div class="tree-child"><button class="tree-row ${selected[key]===option.id?'selected':''}" data-dim="${key}" data-value="${option.id}"><span class="tree-toggle">${hasChildren?(open?'⌄':'›'):''}</span><span class="tree-folder">${hasChildren?'▱':'·'}</span><span>${option.label}</span><small>${optionCount(option.id)||''}</small></button>${hasChildren?`<div class="tree-children ${open?'open':''}">${option.children.map(child=>renderTreeOption(child,key,depth+1)).join('')}</div>`:''}</div>`}function renderFilters(){filters.innerHTML='<div class="filter-tree">'+Object.entries(dimensions).map(([key,d])=>{const active=selected[key]!=='all';const open=expanded[key];return `<div class="tree-module ${active?'active':''}"><button class="tree-row" data-toggle="${key}"><span class="tree-toggle">${open?'⌄':'›'}</span><span class="tree-folder">▱</span><strong>${d.label}</strong><small>${active?d.options.find(o=>o.id===selected[key])?.label||'已选择':'全部'}</small></button><div class="tree-children ${open?'open':''}"><button class="tree-row ${!active?'selected':''}" data-reset="${key}"><span class="tree-toggle"></span><span class="tree-folder">·</span><span>全部${d.label}</span><small>${resources.filter(r=>r.kind===kind).length}</small></button>${d.options.map(o=>renderTreeOption(o,key)).join('')}</div></div>`}).join('')+'</div>';filters.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{expanded[b.dataset.toggle]=!expanded[b.dataset.toggle];renderFilters()});filters.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{selected[b.dataset.reset]='all';renderFilters();render()});filters.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>{selected[b.dataset.dim]=b.dataset.value;renderFilters();render()})}
function matches(r){if(r.kind!==kind)return false;if(scope!=='all'&&r.scope!==scope)return false;if(search&&!(`${r.name} ${r.desc} ${r.tags.join(' ')}`.toLowerCase().includes(search.toLowerCase())))return false;return Object.entries(selected).every(([k,v])=>v==='all'||r.tags.some(t=>t.includes(v)))}
function switchResource(nextKind){kind=nextKind;const isKB=kind==='kb';document.querySelector('#kbNav').classList.toggle('active',isKB);document.querySelector('#agentNav').classList.toggle('active',!isKB);document.querySelector('#pageTitle').textContent=isKB?'知识库':'智能体';document.querySelector('#pageSubtitle').textContent=isKB?'通过业务分类和标签，快速定位机型、项目与技术域知识。':'通过业务分类和标签，快速定位适用于不同机型和项目的智能体。';document.querySelector('#createResource').textContent=isKB?'＋ 新建知识库':'＋ 新建智能体';location.hash=isKB?'knowledge-bases':'agents';render()}
function render(){const list=resources.filter(matches),total=resources.filter(r=>r.kind===kind).length;document.querySelector('#sectionTitle').innerHTML=`全部${kind==='kb'?'知识库':'智能体'} <b>${total}</b>`;document.querySelector('#resultCount').textContent=`当前显示 ${list.length} 个资源`;path.innerHTML='<span>当前路径</span>'+Object.entries(selected).filter(([,v])=>v!=='all').map(([k,v])=>`<span class="path-sep">›</span><span class="path-chip">${dimensions[k].label} / ${v}</span>`).join('')+(Object.values(selected).every(v=>v==='all')?'<span class="path-chip">全部知识</span>':'');cards.innerHTML=list.length?list.map(r=>`<article class="card" data-id="${r.id}"><button class="card-edit" title="编辑标签">✎</button><div class="type-label">${r.kind==='kb'?'知识库':'智能体'}</div><h3>${r.name}</h3><p>${r.desc}</p><div class="tags">${r.tags.map(t=>`<span class="tag ${t.includes('项目')?'hot':''}">${t}</span>`).join('')}</div><div class="meta"><span>${r.kind==='kb'?'▣ '+r.count+' 个文档':'✦ 可配置智能体'}</span><b>打开详情 →</b></div></article>`).join(''):'<div class="empty">没有匹配的资源<br><small>尝试清除筛选条件或搜索其他标签</small></div>';cards.querySelectorAll('.card').forEach(c=>c.onclick=()=>toast(`打开${resources.find(r=>r.id===c.dataset.id).kind==='kb'?'知识库':'智能体'}详情（原型演示）`));cards.querySelectorAll('.card-edit').forEach(b=>b.onclick=e=>{e.stopPropagation();toast('打开标签编辑（原型演示）')})}
document.querySelectorAll('.scope-chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.scope-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');scope=b.dataset.scope;render()});document.querySelector('#search').oninput=e=>{search=e.target.value;render()};document.addEventListener('click',e=>{if(!e.target.closest('.filter-group'))document.querySelectorAll('.filter-menu').forEach(m=>m.classList.remove('open'))});const drawer=document.querySelector('#drawerBackdrop');function openDrawer(){drawer.classList.add('open')}function closeDrawer(){drawer.classList.remove('open')}document.querySelector('#manageFilters').onclick=openDrawer;document.querySelector('#manageTop').onclick=openDrawer;document.querySelector('#closeDrawer').onclick=closeDrawer;document.querySelector('#cancelDrawer').onclick=closeDrawer;document.querySelector('#saveStructure').onclick=()=>{closeDrawer();toast('已保存筛选结构（原型演示）')};document.querySelector('#kbNav').onclick=()=>switchResource('kb');document.querySelector('#agentNav').onclick=()=>switchResource('agent');function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}renderFilters();switchResource(location.hash==='#agents'?'agent':'kb');
</script>
</body>
</html>
